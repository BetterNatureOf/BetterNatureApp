<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="IRIS food rescue">
  <defs>
    <radialGradient id="halo" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF6F9"/><stop offset="1" stop-color="#FFD9E6"/></radialGradient>
    <linearGradient id="std" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA8C8"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4D8D"/><stop offset="1" stop-color="#C41E5A"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5DB088"/><stop offset="1" stop-color="#2A5648"/></linearGradient>
  </defs>
  <circle cx="120" cy="120" r="104" fill="url(#halo)"/>
  <circle cx="120" cy="120" r="103" fill="none" stroke="#fff" stroke-width="2" stroke-opacity=".9"/>
  <!-- stem + leaf -->
  <path d="M120 134V198" stroke="#3D7A67" stroke-width="5" stroke-linecap="round"/>
  <path d="M121 186C134 166 152 158 172 152C164 174 144 188 121 192Z" fill="url(#leaf)"/>
  <!-- side standards (behind) -->
  <path d="M120 132C104 118 103 90 120 70C137 90 136 118 120 132Z" fill="url(#std)" fill-opacity=".7" transform="rotate(-30 120 132)"/>
  <path d="M120 132C104 118 103 90 120 70C137 90 136 118 120 132Z" fill="url(#std)" fill-opacity=".7" transform="rotate(30 120 132)"/>
  <!-- centre standard -->
  <path d="M120 134C98 114 97 76 120 46C143 76 142 114 120 134Z" fill="url(#std)"/>
  <path d="M120 128C112 112 112 84 120 62" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
  <!-- falls (drooping petals) -->
  <path d="M117 130C95 120 64 124 48 148C68 164 100 158 118 136Z" fill="url(#fall)"/>
  <path d="M123 130C145 120 176 124 192 148C172 164 140 158 122 136Z" fill="url(#fall)"/>
  <!-- golden beards -->
  <path d="M110 134L80 143M130 134L160 143" stroke="#FFC27A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="134" r="6" fill="#FFC27A"/>
</svg>
