<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Donation Receipt — BetterNature</title>
<link rel="icon" type="image/png" href="logo.png" />
<style>
  :root {
    --forest: #1B3A2D;
    --pink: #E27396;
    --cream: #FAF7F2;
    --ink: #1A1F2E;
    --ink-60: #6B7280;
    --line: #E6E1D7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    background: var(--cream);
    padding: 40px 20px;
    line-height: 1.55;
  }
  .receipt {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 56px;
    box-shadow: 0 24px 60px rgba(27,58,45,0.08);
  }
  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
  .logo { width: 56px; height: 56px; border-radius: 50%; }
  .org-name { font-size: 22px; font-weight: 700; color: var(--forest); margin: 0; }
  .org-sub { font-size: 13px; color: var(--ink-60); margin: 2px 0 0; }
  .badge { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--pink); font-weight: 700; }
  h1 {
    font-size: 28px; margin: 32px 0 4px; color: var(--forest);
    font-weight: 700; letter-spacing: -0.01em;
  }
  .receipt-no { font-size: 13px; color: var(--ink-60); margin: 0 0 28px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
  .row { display: flex; justify-content: space-between; gap: 20px; margin: 10px 0; font-size: 14px; }
  .row .k { color: var(--ink-60); }
  .row .v { font-weight: 600; text-align: right; }
  .description {
    background: var(--cream); border-radius: 10px; padding: 18px 20px; margin: 16px 0;
    font-size: 15px;
  }
  .description b { display: block; font-size: 18px; margin-bottom: 4px; }
  .impact-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-60);
    margin: 24px 0 10px;
  }
  .impact-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 0 0 8px;
  }
  .impact-tile {
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 12px;
    text-align: center;
  }
  .impact-tile .n {
    display: block;
    font-size: 20px; font-weight: 800; color: var(--forest);
    letter-spacing: -0.01em;
  }
  .impact-tile .l {
    display: block;
    font-size: 10.5px; color: var(--ink-60);
    margin-top: 4px; font-weight: 600; letter-spacing: 0.02em;
  }
  .impact-note {
    font-size: 11px; color: var(--ink-60); font-style: italic;
    margin: 6px 0 0;
  }
  .dropoff {
    margin: 20px 0 8px;
  }
  .dropoff-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-60);
    margin: 0 0 10px;
  }
  .dropoff-frame {
    border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line);
    background: var(--cream);
  }
  .dropoff-frame img {
    display: block;
    width: 100%; height: auto; max-height: 320px; object-fit: cover;
  }
  .dropoff-caption {
    padding: 10px 14px;
    font-size: 12.5px; color: var(--ink-60);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .dropoff-caption b { color: var(--ink); font-weight: 600; }
  @media (max-width: 520px) {
    .impact-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .legal {
    font-size: 12px; color: var(--ink-60); margin-top: 28px; line-height: 1.6;
    border-left: 3px solid var(--pink); padding-left: 14px;
  }
  .actions { margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    appearance: none; border: 0; cursor: pointer; font: inherit;
    padding: 11px 18px; border-radius: 9px; font-weight: 600; font-size: 14px;
    text-decoration: none; display: inline-block;
  }
  .btn--pink { background: var(--pink); color: #fff; }
  .btn--ghost { background: #fff; color: var(--forest); border: 1px solid var(--line); }
  .err, .loading { text-align: center; color: var(--ink-60); padding: 40px; }
  .err { color: #B91C3D; }
  @media print {
    body { background: #fff; padding: 0; }
    .receipt { box-shadow: none; border: 0; padding: 32px; }
    .actions { display: none; }
  }
</style>
</head>
<body>
<div id="root" class="receipt">
  <div class="loading">Loading receipt…</div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBoaYGVe8rObfGC-BKJo3yohbyZOWUD8gw",
  authDomain: "better-nature-app.firebaseapp.com",
  projectId: "better-nature-app",
  storageBucket: "better-nature-app.firebasestorage.app",
  messagingSenderId: "102288708316",
  appId: "1:102288708316:web:d15cda309e77d14b921a19",
};
const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);

const fmtDate = (iso) => iso
  ? new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
  : '';
const fmtN = (n) => Math.round(Number(n) || 0).toLocaleString('en-US');
// Minimal HTML escaper — receipt data comes from Firestore fields
// filled in by volunteers + restaurants, so we can't trust any of
// it to be safe raw. Only the drop-off caption interpolates
// user-supplied text right now, but keep the helper here so any
// future dynamic field is a one-line escapeHtml(...) call.
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Multipliers match src/services/orgStats.js — the canonical numbers
// used everywhere else in the app. Family-days is a display-only
// derivation (3 meals ≈ one 3-person household fed for a day).
const MEALS_PER_LB = 1.2;
const CO2_LB_PER_LB = 3.8;
const WATER_GAL_PER_LB = 175;
const MEALS_PER_FAMILY_DAY = 3;
function impactFromLbs(lbs) {
  const l = Number(lbs) || 0;
  const meals = l * MEALS_PER_LB;
  return {
    meals: fmtN(meals),
    familyDays: fmtN(meals / MEALS_PER_FAMILY_DAY),
    co2: fmtN(l * CO2_LB_PER_LB),
    water: fmtN(l * WATER_GAL_PER_LB),
  };
}

function render(r) {
  const ein = (r.org && r.org.ein) ? r.org.ein : 'pending IRS determination';
  const orgName = (r.org && r.org.legalName) || 'BetterNature Inc.';
  const orgSite = (r.org && r.org.website) || 'betternatureofficial.org';
  const orgEmail = (r.org && r.org.email) || 'info@betternatureofficial.org';
  document.getElementById('root').innerHTML = `
    <div class="header">
      <div>
        <p class="badge">501(c)(3) Donation Receipt</p>
        <h1>Thank you for your contribution.</h1>
        <p class="receipt-no">Receipt No. ${r.receipt_no || '—'}</p>
      </div>
      <div style="text-align:right;">
        <img src="logo.png" alt="" class="logo" onerror="this.style.display='none'" />
        <p class="org-name" style="margin-top:8px;">${orgName}</p>
        <p class="org-sub">${orgSite}</p>
      </div>
    </div>

    <hr/>

    <div class="row"><span class="k">Donor</span><span class="v">${r.restaurant_name || '—'}</span></div>
    <div class="row"><span class="k">Date of donation</span><span class="v">${fmtDate(r.picked_up_at)}</span></div>
    <div class="row"><span class="k">Picked up by</span><span class="v">${r.volunteer_name || 'BetterNature volunteer'}${r.chapter_name ? ' · ' + r.chapter_name + ' Chapter' : ''}</span></div>
    <div class="row"><span class="k">Issued</span><span class="v">${fmtDate(r.issued_at_iso)}</span></div>

    <div class="description">
      <b>${r.weight_lbs} lbs of prepared / perishable food</b>
      Equivalent to approximately ${r.meals_equivalent} meals served.
    </div>

    ${(() => {
      const i = impactFromLbs(r.weight_lbs);
      return `
        <p class="impact-title">Community &amp; environmental impact</p>
        <div class="impact-grid">
          <div class="impact-tile"><span class="n">${i.meals}</span><span class="l">Meals</span></div>
          <div class="impact-tile"><span class="n">${i.familyDays}</span><span class="l">Family-days fed</span></div>
          <div class="impact-tile"><span class="n">${i.co2}</span><span class="l">Lbs CO₂ avoided</span></div>
          <div class="impact-tile"><span class="n">${i.water}</span><span class="l">Gal water saved</span></div>
        </div>
        <p class="impact-note">
          Estimates use Feeding America / EPA WARM / Water Footprint Network baselines. Family-day = 3 meals (three-person household).
        </p>
      `;
    })()}

    ${(() => {
      // Optional drop-off proof + destination fridge. Both fields are
      // populated by completePickup for pickups that flowed through
      // the new drop-off UI (proof photo + fridge fields on the tax
      // receipt doc). Older receipts don't carry these — render nothing.
      const rawPhoto = r.dropoff_photo_url || null;
      // URL allowlist — only https and Firebase Storage's gs:// scheme.
      // Prevents a javascript: or data: URL from a compromised doc
      // running in the receipt page context.
      const photo = (rawPhoto && /^(https:|gs:)\/\//i.test(rawPhoto)) ? rawPhoto : null;
      const fridge = r.fridge_name || null;
      const fridgeAddr = r.fridge_address || null;
      if (!photo && !fridge) return '';
      const captionBits = [];
      if (fridge) captionBits.push(`Delivered to <b>${escapeHtml(fridge)}</b>`);
      if (fridgeAddr) captionBits.push(escapeHtml(fridgeAddr));
      return `
        <div class="dropoff">
          <p class="dropoff-title">Drop-off record</p>
          <div class="dropoff-frame">
            ${photo ? `<img src="${escapeHtml(photo)}" alt="Food delivered to the community fridge" onerror="this.style.display='none'" />` : ''}
            ${captionBits.length ? `<div class="dropoff-caption">${captionBits.join('<span aria-hidden="true">·</span>')}</div>` : ''}
          </div>
        </div>
      `;
    })()}

    <p class="legal">
      <b>No goods or services were provided in exchange for this contribution.</b><br/>
      ${orgName} is a 501(c)(3) tax-exempt nonprofit organization. EIN: ${ein}.
      Per IRS Publication 561, the donor is responsible for determining the
      fair-market value of donated goods. This receipt acknowledges only the
      description and quantity of items received. Please retain this receipt
      for your tax records. Questions: ${orgEmail}.
    </p>

    <div class="actions">
      <button class="btn btn--pink" onclick="window.print()">Print / Save as PDF</button>
      <a class="btn btn--ghost" href="https://${orgSite}">Visit ${orgName}</a>
    </div>
  `;
}

async function load() {
  try {
    const id = new URL(window.location.href).searchParams.get('id');
    if (!id) {
      document.getElementById('root').innerHTML = '<div class="err">Missing receipt id.</div>';
      return;
    }
    const snap = await getDoc(doc(db, 'tax_receipts', id));
    if (!snap.exists()) {
      document.getElementById('root').innerHTML = '<div class="err">Receipt not found.</div>';
      return;
    }
    render({ id: snap.id, ...snap.data() });
  } catch (e) {
    console.error(e);
    document.getElementById('root').innerHTML = '<div class="err">Could not load receipt.</div>';
  }
}
load();
</script>
</body>
</html>
